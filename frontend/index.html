/* ------------------------------------------------- loading the signed-in space */
/* The prototype dates its sample records around PROTO_TODAY; move them by the same number of days as today moved. */
function rebase(s) {
  const delta = Math.round((pd(TODAY) - pd(PROTO_TODAY)) / 86400000);
  return addDays(s.slice(0, 10), delta) + s.slice(10);
}
/* A visit as the screens expect it. Sample visits carry day_offset, so they stay "upcoming" or "past" correctly. */
function mapVisit(r) {
  const x = r.extra || {};
  return Object.assign({}, x, {
    id: String(r.id), key: x.key, seed: !!r.is_seed,
    date: r.day_offset !== null && r.day_offset !== undefined ? addDays(TODAY, r.day_offset) : String(r.visit_date).slice(0, 10),
    time: String(r.visit_time || '09:00').slice(0, 5), doc: r.doctor_id, status: r.status, objective: r.objective,
    outcome: r.rep_notes, result: r.outcome || undefined

}
/* The sample compliance records, follow-ups and so on refer to doctors and visits by placeholder; fill in this space's own. */
function personalise(keymap) {
  const names = {}; DOCTORS.forEach(function (d) { names[d.id] = d.name; });
  const fix = function (x) {
    if (typeof x === 'string') {
      if (/^v\d{3}$/.test(x)) return keymap[x] || x;
      if (/^\d{4}-\d{2}-\d{2}( \d\d:\d\d)?$/.test(x)) return rebase(x);
      if (x === SAMPLE_REP) return REP.name;
      return x.replace(/\{(d\d)\}/g, function (m, id) { return names[id] || 'the doctor'; });
    }
    if (Array.isArray(x)) return x.map(fix);
    if (x && typeof x === 'object') { const o = {}; Object.keys(x).forEach(function (k) { o[k] = fix(x[k]); }); return o; }
    return x;
  };
  state.flags = fix(FLAGS_SEED); state.followups = fix(FOLLOWUPS_SEED); state.sciQs = fix(SCI_SEED);
  state.aiLog = fix(AI_LOG_SEED); state.opps = fix(OPPS_SEED); state.activity = fix(ACTIVITY_SEED);
  ACTIONS.forEach(function (a) { a.visit = keymap[a.visit] || a.visit; });

/* Loads this space's company details, doctors and visits. Pass the company from the login response, or null to ask /me. */
function loadSpace(client) {

  ]).then(function (r) {
    Object.assign(SPACE, r[0].client);
    // the person shown at the bottom of the menu is whoever signed in
    REP.name = r[0].username;
    REP.initials = (REP.name.split(/[^a-z0-9]+/i).filter(Boolean).map(function (w) { return w[0]; }).join('').slice(0, 2) || REP.name.slice(0, 2)).toUpperCase();
    REP.role = SPACE.name + ' · ' + SPACE.product;

    state.live.doctor = DOCTORS.length ? DOCTORS[0].id : '';

}
function timelineHTML() {
  const ev = [['2022', 'EETOX trial published', 'E22'], ['2023', 'Cochrane review published', 'CC'], ['2025', 'EETOX sub-analysis; NHANES diet analysis (flash cards)', 'E25'], ['2026', 'Diabetic CKD probiotic meta-analysis (flash cards)', 'FC']];
  return '<ol class="tl">' + ev.map(function (e) { return '<li class="s-' + e[2] + '"><i></i><b>' + e[0] + '</b><span>' + e[1] + '</span></li>'; }).join('') + '</ol>';
}
function tabEvidence() {
  return '<div class="cols"><section class="card">' + eyebrow('Findings by kind') + '<p class="hint">What the knowledge base is made of: results are only part of it.</p>' + donutHTML() + '</section>' +
    '<section class="card">' + eyebrow('Evidence coverage by area') + '<p class="hint">Product-specific results held in the documents. Gaps are shown, not hidden.</p>' + coverageHTML() + '</section></div>' +
    '<section class="card">' + eyebrow('Evidence timeline') + '<p class="hint">When the documents were published.</p>' + timelineHTML() + '</section>' + tabGlance();
}
function tabStrengths() {
  return '<div class="cols"><section class="card">' + eyebrow('Key strengths') + '<ul class="flist">' + findingRows(findingsOf(['E22-01', 'E22-09', 'E22-29', 'E22-32'])) + '</ul></section>' +
    '<section class="card">' + eyebrow('Evidence gaps / limitations') + '<ul class="flist">' + findingRows(findingsOf(['E22-31', 'E22-07', 'E22-36', 'E22-39', 'E22-35', 'CC-14'])) + '</ul></section></div>' +
    '<section class="card">' + eyebrow('Key product insights') + '<div class="insgrid">' +
      '<article class="insc"><span class="eyebrow">Strongest evidence area</span><h4>p-cresol sulfate (toxin marker)</h4><ul class="flist">' + findingRows(findingsOf(['E22-10']), { noId: true }) + '</ul></article>' +
      '<article class="insc"><span class="eyebrow">Evidence gap</span><h4>Safety and clinical outcomes</h4><ul class="flist">' + findingRows(findingsOf(['E22-36', 'E22-39']), { noId: true }) + '</ul></article>' +
      '<article class="insc"><span class="eyebrow">Recommended scientific focus</span><h4>State the limits with every result</h4><p>Prepare each discussion around the design, the result and its limits together, and send unanswered questions for scientific review.</p></article></div></section>';
}

function productDetailPage() {
  const tabs = [['overview', 'Overview'], ['evidence', 'Evidence overview'], ['strengths', 'Strengths & limitations'], ['knowledge', 'Knowledge base'], ['sources', 'Sources']].map(function (t) {
    return '<button type="button" role="tab" aria-selected="' + (state.productTab === t[0]) + '" class="tab' + (state.productTab === t[0] ? ' on' : '') + '" data-act="p-tab" data-id="' + t[0] + '">' + t[1] + (t[0] === 'knowledge' ? '<em>' + FINDINGS.length + '</em>' : '') + '</button>';
  }).join('');
  const body = { overview: tabOverview, evidence: tabEvidence, strengths: tabStrengths, knowledge: tabKnowledge, sources: tabSources }[state.productTab] || tabOverview;
  return crumbs([{ t: 'Product Intelligence', href: '#/product' }, { t: co().product }]) +
    '<section class="card phead"><div><h1>' + co().product + '</h1><p class="hint">' + co().name + ' \u00b7 Therapeutic area: Chronic Kidney Disease</p></div><div class="pc-tags">' + badge('Small trial, 12 weeks', 'amb') + badge('Cochrane: uncertain', 'amb') + '<a class="btn primary" href="#/ask" data-act="go">' + icon('spark') + 'Ask the Evidence</a></div></section>' +
    '<div class="tabs solo" role="tablist" aria-label="Product views">' + tabs + '</div>' + body();
}
function pageProduct(id) { return id ? productDetailPage() : productListPage(); }

/* ==========================================================================
   Compliance (deck slide 16): score, items requiring attention, actions,
   recent activity, insight. Plus the claim checker, materials, training and
   the AI audit log.
   ========================================================================== */
function sevPill(s) { return '<span class="sev ' + s.toLowerCase() + '">' + s + '</span>'; }
function priPill(p) { return '<span class="sev ' + p.toLowerCase() + '">Priority: ' + p + '</span>'; }
function flagBtnLabel(f) { return f.action === 'doc' ? 'Complete Documentation' : f.action === 'followup' ? 'Review Activity' : 'Review & Resolve'; }
const PRI_ORDER = { High: 0, Medium: 1, Low: 2 };
const INSIGHT_TEXT = {
  'Scientific Communication': 'Link every scientific statement to an approved evidence reference before it is sent. The claim checker and Ask the Evidence show which sources support a statement.',
  'Visit Documentation': 'Complete interaction notes immediately after each visit to reduce pending compliance actions.',
  'Follow-Up Compliance': 'Mark follow-up activities as reviewed as soon as they are completed.',
  'Safety Reporting': 'Report any adverse event to Pharmacovigilance per company SOP on the same day you hear of it.'
};

function pageCompliance() {
  const flags = openFlags(); const score = complianceScore();
  const docPending = flags.filter(function (f) { return f.cat === 'Visit Documentation' || f.cat === 'Follow-Up Compliance'; }).length;
  const kpis = '<div class="kgrid three">' +
    '<div class="kcard static"><span class="k-v">' + score + '%</span><span class="k-l">Overall Compliance Score</span><span class="k-s">' + (score >= 90 ? 'Compliance status remains within acceptable limits.' : 'Resolve the open items to raise the score.') + '</span></div>' +
    '<div class="kcard static"><span class="k-v">' + flags.length + '</span><span class="k-l">Items Requiring Attention</span><span class="k-s">Actions require review or completion.</span></div>' +
    '<div class="kcard static"><span class="k-v">' + docPending + '</span><span class="k-l">Documentation Pending</span><span class="k-s">Visit or follow-up records require completion.</span></div></div>';

  const actions = flags.slice().sort(function (a, b) { return PRI_ORDER[a.pri] - PRI_ORDER[b.pri]; }).map(function (f) {
    return '<article class="flag ' + f.pri.toLowerCase() + '"><div class="fl-main"><h3>' + esc(f.title) + '</h3><p>' + esc(f.detail) + '</p>' +
      '<div class="fl-meta">' + badge(f.cat, 'plain') + priPill(f.pri) + (f.status === 'Escalated' ? badge('Escalated', 'amb') : '') + '</div>' +
      (f.fix ? '<div class="fix"><span class="lbl">Suggested fix</span><p>' + esc(f.fix) + '</p></div>' : '') + (f.src && f.src.length ? '<div class="srcs">' + srcList(f.src) + '</div>' : '') + '</div>' +
      '<button type="button" class="btn ' + (f.pri === 'High' ? 'primary' : 'ghost') + '" data-act="flag-act" data-id="' + f.id + '">' + flagBtnLabel(f) + '</button></article>';
  }).join('') || '<p class="empty">No compliance actions are open.</p>';

  const activity = state.activity.slice(0, 6).map(function (a) {
    return '<li class="act"><div><b>' + esc(a.title) + '</b><span class="hint">' + esc(a.when) + '</span><p>' + esc(a.text) + '</p></div>' + badge(a.badge, a.badge === 'COMPLIANT' ? 'ok' : 'amb') + '</li>';
  }).join('');

  const counts = {}; flags.forEach(function (f) { counts[f.cat] = (counts[f.cat] || 0) + 1; });
  const top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })[0];
  const insight = top ? '<p><b>Most common pending activity: ' + top.toLowerCase() + '.</b></p><p>' + INSIGHT_TEXT[top] + '</p>' : '<p><b>No pending compliance activity.</b></p><p>Keep documenting each interaction straight after the visit.</p>';

  const mats = MATERIALS.map(function (m) {
    const cls = m.status === 'Approved' ? 'ok' : m.status === 'Reference only' ? 'brand' : 'amb';
    return '<tr><th scope="row"><b>' + sub(m.name) + '</b><span>' + esc(m.cite) + '</span></th><td>' + m.ref + '</td><td>' + m.ver + '</td><td>' + (m.expires === '\u2013' ? '\u2013' : fmtDMY(m.expires)) + '</td><td>' + badge(m.status, cls) + '</td><td>' + esc(m.use) +
      (m.open ? '<ul class="open-pts">' + m.open.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') + '</ul>' : '') + '</td></tr>';
  }).join('');
  const train = TRAINING.map(function (t) {
    return '<li><span class="tr-n">' + esc(t.name) + '</span>' + (t.status === 'Completed' ? badge('Completed ' + fmt(t.date), 'ok') : '<span class="tr-p"><span class="bar" aria-hidden="true"><i style="width:' + t.progress + '%"></i></span>' + t.progress + '% \u00b7 due ' + fmt(t.due) + '</span>') + '</li>';
  }).join('');
  const log = state.aiLog.slice().sort(function (a, b) { return a.t < b.t ? 1 : -1; }).map(function (r) {
    const lab = r.label || (r.briefing ? 'Briefing built from the knowledge base' : { covered: 'Answered with sources', partial: 'Partly covered, with sources', notcovered: 'Not covered, declined' }[r.kind]);
    return '<tr><td class="nowrap">' + fmt(r.t.slice(0, 10)) + ', ' + r.t.slice(11) + '</td><td>' + esc(r.q) + '</td><td>' + esc(r.topic) + '</td><td><span class="tag ' + r.kind + '">' + lab + '</span></td></tr>';
  }).join('');

  return '<div class="page-head"><div><h1>Compliance</h1><p class="sub">Monitor compliance requirements, identify actions requiring attention, and maintain a clear record of representative activities. Sample data.</p></div></div>' + kpis +
    '<section class="card">' + eyebrow('Compliance actions') + '<div class="flags">' + actions + '</div></section>' +
    '<div class="cols"><section class="card">' + eyebrow('Recent compliance activity') + '<ul class="acts-feed">' + activity + '</ul></section>' +
    '<section class="card insight">' + eyebrow('Compliance insight') + insight + '</section></div>' +
    '<div class="cols"><section class="card">' + eyebrow('Claim checker') + '<p class="hint">Paste a sentence from an email, note or message. The check flags statements the documents do not support. It supports, but does not replace, Medical, Legal and Regulatory review.</p>' +
      '<label class="field"><span class="sr">Text to check</span><textarea id="claimText" rows="4" placeholder="For example: ' + co().product + ' is proven safe and delays dialysis."></textarea></label>' +
      '<div class="btn-row"><button type="button" class="btn primary" data-act="claim-check">Check claims</button><button type="button" class="btn ghost" data-act="claim-example">Try an example</button></div><div id="claimResult"></div>' +
      '<div class="note-box">' + icon('info') + '<p>If a doctor mentions an adverse event, report it to Pharmacovigilance per company SOP. The AI answers contain no safety data to rely on.</p></div></section>' +
    '<section class="card">' + eyebrow('How the AI is controlled') + '<ul class="plain-list ctl"><li>Answers are built only from the ' + FINDINGS.length + '-finding knowledge base; every finding carries its paper and page, or slide.</li><li>Every answer carries the small-trial, 12-week and Cochrane limitations.</li><li>Questions outside the documents are declined, not guessed, and can be sent for scientific review.</li><li>Visit notes are checked sentence by sentence; unsupported claims are flagged and added here when you save.</li><li>Each question, briefing and notes analysis is logged below.</li></ul>' +
      eyebrow('Required training') + '<ul class="train">' + train + '</ul></section></div>' +
    '<section class="card flush"><div class="card-h pad">' + eyebrow('Approved materials') + '</div><div class="table-wrap"><table class="tbl"><thead><tr><th>Material</th><th>Ref</th><th>Version</th><th>Expires</th><th>Status</th><th>Permitted use</th></tr></thead><tbody>' + mats + '</tbody></table></div></section>' +
    '<section class="card flush"><div class="card-h pad">' + eyebrow('AI answer audit log') + '<span class="hint">Includes questions asked in this session</span></div><div class="table-wrap"><table class="tbl"><thead><tr><th>When</th><th>Question</th><th>Topic</th><th>Outcome</th></tr></thead><tbody>' + log + '</tbody></table></div></section>';
}
function claimResultHTML(found) {
  if (!found.length) return '<div class="cr ok">' + icon('check') + '<div><b>No issues found by the checker.</b><p>The text does not trip any rule. It still needs normal review before use.</p></div></div>';
  return '<div class="cr-list">' + found.map(function (f) {
    return '<div class="cr ' + f.sev.toLowerCase() + '"><div class="cr-h">' + sevPill(f.sev) + '<b>' + f.label + '</b>' + (f.match ? '<code>' + esc(f.match) + '</code>' : '') + '</div><p>' + esc(f.why) + '</p>' +
      '<div class="fix"><span class="lbl">Suggested fix</span><p>' + esc(f.fix) + '</p></div><div class="srcs">' + srcList(f.src) + '</div></div>';
  }).join('') + '</div>';
}

/* ================================================================ START-UP */
function renderBanner() {
  $('#banner').innerHTML = icon('alert') + '<span>Demo only</span>';
}

function startApp() {
  appReady = true;
  renderBanner();
  document.getElementById('root').innerHTML = shellHTML();
  parseHash();
  renderAll();
  window.__pra = { state: state, ask: ask, renderAll: renderAll };
}

function loginShell(inner) {
  document.getElementById('root').innerHTML = '<div class="login"><div class="login-card">' +
    '<div class="login-brand"><span class="mark">' + icon('product') + '</span><span class="brand-name">Pharma Rep App</span></div>' + inner + '</div></div>';
}

function showLogin(notice) {
  appReady = false;
  document.title = 'Sign in · Pharma Rep App';
  renderBanner();
  document.getElementById('root').innerHTML =
    '<div class="login"><form class="login-card" id="loginForm" novalidate>' +
      '<div class="login-brand"><span class="mark">' + icon('product') + '</span><span class="brand-name">Pharma Rep App</span></div>' +
      '<h1>Sign in</h1><p class="login-sub">Enter the username and password you were given.</p>' +
      '<label>Username<input id="loginUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus></label>' +
      '<label>Password<input id="loginPass" type="password" autocomplete="current-password"></label>' +
      '<div class="login-err" id="loginErr" role="alert"' + (notice ? '' : ' hidden') + '>' + esc(notice || '') + '</div>' +
      '<button type="submit" class="btn primary" id="loginBtn">Sign in</button>' +
    '</form></div>';
  const fail = function (msg) { const e = document.getElementById('loginErr'); e.textContent = msg; e.hidden = false; };
  document.getElementById('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    const u = document.getElementById('loginUser').value.trim(); const p = document.getElementById('loginPass').value;
    if (!u || !p) return fail('Enter your username and password.');
    const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
    apiCall('POST', '/login', { username: u, password: p }, 20000, true).then(function (r) {
      setToken(r.token);
      return loadSpace(r.client).then(startApp, function (err) { setToken(''); throw err; });
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = 'Sign in';
      if (err.status === 401 || err.status === 429) fail(err.detail || 'Wrong username or password.');
      else fail(liveErrorText(err));
    });
  });
}

function showDown(err) {
  appReady = false;
  loginShell('<h1>Can’t reach the demo server</h1><p class="login-sub">' + esc(liveErrorText(err)) + '</p>' +
    '<button type="button" class="btn primary" data-retry="1">Try again</button><button type="button" class="linkbtn" data-logout="1">Log out</button>');
}

function boot() {
  renderBanner();
  if (!getToken()) return showLogin(takeNotice());
  loginShell('<p class="login-sub">Loading your space…</p>');
  loadSpace(null).then(startApp, function (err) { if (!(err && err.status === 401)) showDown(err); });   // a 401 already signed the user out
}

document.addEventListener('click', function (e) {
  const t = e.target.closest && e.target.closest('[data-logout],[data-retry]');
  if (!t) return;
  if (t.hasAttribute('data-logout')) signOut(); else boot();
});

boot();

</script>
</body>
</html>
