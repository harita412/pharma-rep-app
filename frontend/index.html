<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pharma Rep App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--f:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;--bg:#F2F5F7;--surface:#FFFFFF;--surface-2:#F7F9FA;--ink:#13202A;--ink-2:#3F4E5A;--muted:#5E7080;--line:#DDE4EA;--line-2:#EAEFF3;--side:#0E1C26;--side-ink:#CAD6DE;--side-mute:#8DA1AF;--side-line:rgba(255,255,255,.09);--side-active:rgba(255,255,255,.11);--side-hover:rgba(255,255,255,.06);--shadow:0 1px 2px rgba(15,30,45,.06), 0 6px 18px rgba(15,30,45,.07);--ok:#17784B;--ok-soft:#DEF2E7;--bad:#B3263E;--bad-soft:#FBE2E7;--amb:#8F5300;--amb-soft:#FBEACB;--amb-bar:#D69A2E;--slate:#4B5B68;--slate-soft:#E7ECF0;--slate-bar:#9AA9B5;--warn-bg:#FFF5DE;--warn-line:#E4B14F;--warn-ink:#5C3D00;--p-evidence:#2457C5;--p-evidence-soft:#E2EAFB;--p-believer:#17784B;--p-believer-soft:#DEF2E7;--p-reluctant:#8F5300;--p-reluctant-soft:#FBEACB;--p-non:#B3263E;--p-non-soft:#FBE2E7;--s-e22:#0B6A8A;--s-e22-t:#0B6A8A;--s-e22-r:rgba(11,106,138,.22);--s-e25:#5B43BC;--s-e25-t:#5B43BC;--s-e25-r:rgba(91,67,188,.22);--s-cc:#A82A22;--s-cc-t:#A82A22;--s-cc-r:rgba(168,42,34,.22);--s-fc:#8A5A00;--s-fc-t:#8A5A00;--s-fc-r:rgba(138,90,0,.22);--on-s:#FFFFFF;--brand:#0B7A75;--brand-bright:#2FC7BD;--brand-ink:#FFFFFF;--brand-soft:#DCF0EE;--brand-line:#A6D6D2;--brand-text:#0A645F;}
:root[data-company="eldroga"]{--brand:#5A3FD1;--brand-bright:#A592F5;--brand-ink:#FFFFFF;--brand-soft:#E8E3FA;--brand-line:#C3B8F2;--brand-text:#4A31B6;}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){--bg:#0A131A;--surface:#111E28;--surface-2:#152532;--ink:#E7EDF1;--ink-2:#BBC8D1;--muted:#8CA0AE;--line:#233544;--line-2:#1B2C39;--side:#070F15;--side-ink:#C2CFD8;--side-mute:#7F93A2;--shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);--ok:#4FCB8B;--ok-soft:#12372A;--bad:#FF8CA1;--bad-soft:#40181F;--amb:#F0B85A;--amb-soft:#3D2E10;--amb-bar:#C98A24;--slate:#A9B8C4;--slate-soft:#1D2D39;--slate-bar:#5D7384;--warn-bg:#2A2108;--warn-line:#8A6A1D;--warn-ink:#F3D58E;--p-evidence:#8CB2FF;--p-evidence-soft:#16264A;--p-believer:#4FCB8B;--p-believer-soft:#12372A;--p-reluctant:#F0B85A;--p-reluctant-soft:#3D2E10;--p-non:#FF8CA1;--p-non-soft:#40181F;--s-e22:#5BC0E0;--s-e22-t:#7CD0EA;--s-e22-r:rgba(91,192,224,.3);--s-e25:#A592F5;--s-e25-t:#BBAEFA;--s-e25-r:rgba(165,146,245,.3);--s-cc:#FF8A80;--s-cc-t:#FFA39B;--s-cc-r:rgba(255,138,128,.3);--s-fc:#E8B24E;--s-fc-t:#F0C676;--s-fc-r:rgba(232,178,78,.3);--on-s:#07151D;--brand:#34BDB3;--brand-bright:#34BDB3;--brand-ink:#04211F;--brand-soft:#0F3836;--brand-line:#1E6B66;--brand-text:#6FE0D6;}
:root:not([data-theme="light"])[data-company="eldroga"]{--brand:#9C88F7;--brand-bright:#B4A4FF;--brand-ink:#17103D;--brand-soft:#2A2352;--brand-line:#4B3FA0;--brand-text:#C1B4FF;}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0A131A;--surface:#111E28;--surface-2:#152532;--ink:#E7EDF1;--ink-2:#BBC8D1;--muted:#8CA0AE;--line:#233544;--line-2:#1B2C39;--side:#070F15;--side-ink:#C2CFD8;--side-mute:#7F93A2;--shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);--ok:#4FCB8B;--ok-soft:#12372A;--bad:#FF8CA1;--bad-soft:#40181F;--amb:#F0B85A;--amb-soft:#3D2E10;--amb-bar:#C98A24;--slate:#A9B8C4;--slate-soft:#1D2D39;--slate-bar:#5D7384;--warn-bg:#2A2108;--warn-line:#8A6A1D;--warn-ink:#F3D58E;--p-evidence:#8CB2FF;--p-evidence-soft:#16264A;--p-believer:#4FCB8B;--p-believer-soft:#12372A;--p-reluctant:#F0B85A;--p-reluctant-soft:#3D2E10;--p-non:#FF8CA1;--p-non-soft:#40181F;--s-e22:#5BC0E0;--s-e22-t:#7CD0EA;--s-e22-r:rgba(91,192,224,.3);--s-e25:#A592F5;--s-e25-t:#BBAEFA;--s-e25-r:rgba(165,146,245,.3);--s-cc:#FF8A80;--s-cc-t:#FFA39B;--s-cc-r:rgba(255,138,128,.3);--s-fc:#E8B24E;--s-fc-t:#F0C676;--s-fc-r:rgba(232,178,78,.3);--on-s:#07151D;--brand:#34BDB3;--brand-bright:#34BDB3;--brand-ink:#04211F;--brand-soft:#0F3836;--brand-line:#1E6B66;--brand-text:#6FE0D6;}
:root[data-theme="dark"][data-company="eldroga"]{--brand:#9C88F7;--brand-bright:#B4A4FF;--brand-ink:#17103D;--brand-soft:#2A2352;--brand-line:#4B3FA0;--brand-text:#C1B4FF;}
:root[data-theme="light"]{color-scheme:light}


:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; -webkit-text-size-adjust: 100%; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--f); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
#root { height: 100%; }
.login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
.login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 28px 26px 24px; display: flex; flex-direction: column; gap: 14px; }
.login-brand { display: flex; align-items: center; gap: 10px; }
.login-brand .brand-name { color: var(--ink); }
.login-card h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.login-card .login-sub { color: var(--muted); font-size: 13.5px; margin-top: -8px; }
.login-card label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.login-card input { height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14.5px; font-weight: 400; }
.login-card input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
.login-err { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.login-card .btn { width: 100%; justify-content: center; height: 42px; }
.side-out { margin-top: 10px; background: none; border: 1px solid var(--side-line); color: var(--side-ink); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
.side-out:hover { background: var(--side-hover); color: #fff; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
b, strong { font-weight: 650; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
.ic { width: 18px; height: 18px; flex: none; }
.muted { color: var(--muted); }
.nowrap { white-space: nowrap; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; padding: 18px 12px 14px; min-height: 0; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; }
.mark { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; }
.mark .ic { width: 18px; height: 18px; }
.brand-name { font-weight: 650; font-size: 16px; color: #fff; letter-spacing: -0.005em; }
#nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { position: relative; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 42px; border-radius: 8px; color: var(--side-ink); font-weight: 500; }
.nav-item:hover { background: var(--side-hover); color: #fff; }
.nav-item.active { background: var(--side-active); color: #fff; font-weight: 600; }
.nav-item.active::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--brand-bright); }
.side-foot { margin-top: auto; padding: 18px 10px 4px; border-top: 1px solid var(--side-line); }
.rep { display: flex; align-items: center; gap: 10px; }
.rep-av { background: var(--side-active); color: #fff; }
.rep-name { color: #fff; font-weight: 600; font-size: 13.5px; }
.rep-role { color: var(--side-mute); font-size: 12px; }
.sample-note { margin-top: 12px; font-size: 12px; line-height: 1.45; color: var(--side-mute); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 10px 28px; min-height: 64px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.top-spacer { flex: 1; }
.top-date { color: var(--muted); font-size: 13px; white-space: nowrap; }
.content { flex: 1; overflow-y: auto; min-height: 0; outline: none; scroll-behavior: auto; }
.page { max-width: 1180px; margin: 0 auto; padding: 26px 28px 56px; }

.switch { display: inline-flex; padding: 3px; gap: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
.seg { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; padding: 6px 14px; border: 1px solid transparent; border-radius: 9px; background: transparent; cursor: pointer; line-height: 1.2; min-height: 44px; }
.seg-co { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.seg-pr { font-size: 12px; color: var(--muted); }
.seg:hover { background: var(--surface); }
.seg.on { background: var(--brand-soft); border-color: var(--brand-line); }
.seg.on .seg-co, .seg.on .seg-pr { color: var(--brand-text); }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--bg); }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 7px; }
.icon-btn.sm .ic { width: 15px; height: 15px; }
.menu-btn { display: none; }
.scrim { display: none; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
h1 { font-size: 26px; line-height: 1.15; font-weight: 650; letter-spacing: -0.015em; }
h2 { font-size: 16px; font-weight: 650; letter-spacing: -0.005em; }
h3 { font-size: 14.5px; font-weight: 650; }
.sub { color: var(--muted); margin-top: 6px; max-width: 62ch; }
.hint { color: var(--muted); font-size: 13px; }
.lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.empty { color: var(--muted); padding: 14px 4px; }
.link { color: var(--brand-text); font-weight: 600; font-size: 13.5px; }
.link:hover { text-decoration: underline; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 600; font-size: 13.5px; margin-bottom: 14px; }
.back:hover { color: var(--ink); }
.plain { color: var(--muted); font-size: 13px; }

/* ---------- buttons, chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.07); background: var(--brand); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn.sm .ic { width: 15px; height: 15px; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; cursor: pointer; text-align: left; line-height: 1.3; }
.chip.q:hover { border-color: var(--brand); color: var(--brand-text); background: var(--brand-soft); }
.chip.sm { min-height: 30px; padding: 4px 10px; font-size: 13px; }

.persona { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--pcs); color: var(--pc); white-space: nowrap; }
.persona i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.p-evidence { --pc: var(--p-evidence); --pcs: var(--p-evidence-soft); }
.p-believer { --pc: var(--p-believer); --pcs: var(--p-believer-soft); }
.p-reluctant { --pc: var(--p-reluctant); --pcs: var(--p-reluctant-soft); }
.p-non { --pc: var(--p-non); --pcs: var(--p-non-soft); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 650; font-size: 13px; background: var(--pcs, var(--bg)); color: var(--pc, var(--ink)); flex: none; letter-spacing: 0.01em; }
.avatar.big { width: 56px; height: 56px; font-size: 18px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--muted); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--ok); } .status.brand { color: var(--brand-text); } .status.amb { color: var(--amb); }
.sev { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 650; flex: none; }
.sev.high { background: var(--bad-soft); color: var(--bad); }
.sev.medium { background: var(--amb-soft); color: var(--amb); }
.sev.low { background: var(--slate-soft); color: var(--slate); }

/* ---------- cards & grid ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-bottom: 18px; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h.pad { padding: 18px 22px 0; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.cols.wide-left { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.cols > .card, .cols > .stack > .card { margin-bottom: 18px; }
.stack { min-width: 0; }
.mini-h { margin: 18px 0 8px; font-size: 13px; font-weight: 650; color: var(--ink-2); }
.lede { font-size: 15px; line-height: 1.55; color: var(--ink); margin-top: 10px; max-width: 70ch; }
.pdef { color: var(--ink-2); margin-top: 10px; }
.plain-list { margin-top: 2px; }
.plain-list li { position: relative; padding-left: 16px; margin: 6px 0; color: var(--ink-2); }
.plain-list li::before { content: ""; position: absolute; left: 3px; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; }
.kpi { padding: 18px 22px; border-left: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi-l { color: var(--muted); font-size: 13px; font-weight: 600; }
.kpi-v { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; margin-top: 4px; }
.kpi-v small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.kpi-s { color: var(--muted); font-size: 13px; margin-top: 4px; }
.bar { position: relative; height: 6px; border-radius: 4px; background: var(--line-2); margin-top: 10px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--brand); }
.bar i.booked { background: var(--brand-line); }

/* dashboard rows */
.trow, .mrow { display: flex; align-items: center; gap: 12px; padding: 12px 8px; margin: 0 -8px; border-radius: 9px; }
.t-main .persona { align-self: flex-start; margin: 4px 0 3px; display: inline-flex; font-size: 12px; padding: 2px 9px 2px 7px; color: var(--pc); font-size: 12px; -webkit-line-clamp: unset; line-clamp: unset; }
.trow:hover, .mrow:hover { background: var(--bg); }
.trow + .trow, .mrow + .mrow { border-top: 1px solid var(--line-2); border-radius: 0; }
.t-time { font-weight: 650; width: 44px; flex: none; }
.t-main, .m-main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.t-main > span, .m-main > span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; }
.m-spark { color: var(--pc); display: block; flex: none; }
.m-plan { display: flex; flex-direction: column; align-items: flex-end; min-width: 64px; }
.m-plan span { color: var(--muted); font-size: 12px; }
.nba li a { display: flex; gap: 12px; align-items: flex-start; padding: 10px 8px; margin: 0 -8px; border-radius: 9px; }
.nba li a:hover { background: var(--bg); }
.nb-when { font-size: 12.5px; font-weight: 650; color: var(--brand-text); width: 92px; flex: none; padding-top: 1px; }
.nb-text { flex: 1; color: var(--ink-2); }
.nb-text b { color: var(--ink); }
.tq li { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(60px, 1fr) 20px; gap: 12px; align-items: center; padding: 7px 0; }
.tq-t { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tq-bar { height: 8px; border-radius: 4px; background: var(--line-2); overflow: hidden; }
.tq-bar i { display: block; height: 100%; border-radius: 4px; background: var(--ok); }
.tq-bar.partial i { background: var(--amb-bar); } .tq-bar.notcovered i { background: var(--slate-bar); }
.tq-n { text-align: right; font-weight: 600; color: var(--ink-2); }
.legend { margin-top: 12px; color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lg { width: 10px; height: 10px; border-radius: 3px; background: var(--ok); margin-left: 6px; }
.lg.partial { background: var(--amb-bar); } .lg.notcovered { background: var(--slate-bar); }
.flag-mini li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line-2); font-size: 13.5px; }
.flag-mini li:first-child { border-top: 0; }

/* ---------- doctors ---------- */
.dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
.dcard { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--pc); border-radius: 12px; padding: 20px 22px 18px; }
.dcard:hover { border-color: var(--pc); box-shadow: var(--shadow); }
.dcard .persona { align-self: flex-start; }
.dc-top { display: flex; gap: 14px; align-items: center; }
.dc-top h3 { font-size: 17px; }
.dc-top p { color: var(--muted); font-size: 13.5px; }
.dc-profile { color: var(--ink-2); font-size: 14px; }
.dc-foot { display: flex; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line-2); color: var(--muted); font-size: 13px; }
.dc-foot b { color: var(--ink); font-weight: 600; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.step { display: flex; flex-direction: column; gap: 6px; }
.step i { height: 6px; border-radius: 3px; background: var(--line); }
.step.on i { background: var(--pc, var(--brand)); }
.step em { font-style: normal; font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.step.now em { color: var(--ink); font-weight: 650; }
.plegend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 28px; }
.pl { padding-left: 14px; border-left: 4px solid var(--pc); display: flex; flex-direction: column; gap: 3px; }
.pl b { color: var(--pc); }
.pl span { color: var(--ink-2); font-size: 13.5px; }
.dhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; border-top: 4px solid var(--pc); }
.dh-l { display: flex; gap: 16px; align-items: center; }
.dh-l p { color: var(--muted); margin-top: 4px; }
.dh-tags { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.dh-facts { display: grid; grid-template-columns: repeat(3, auto); gap: 8px 28px; align-content: center; }
.dh-facts dt { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.dh-facts dd { font-weight: 600; max-width: 26ch; }
.dd { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 10px; }
.dd h3 { font-size: 13px; margin-bottom: 6px; }
.dd li { position: relative; padding-left: 22px; margin: 7px 0; color: var(--ink-2); font-size: 14px; }
.dd .do h3 { color: var(--ok); } .dd .dont h3 { color: var(--bad); }
.dd .do li::before { content: ""; position: absolute; left: 2px; top: 0.4em; width: 10px; height: 6px; border-left: 2px solid var(--ok); border-bottom: 2px solid var(--ok); transform: rotate(-45deg); }
.dd .dont li::before { content: ""; position: absolute; left: 2px; top: 0.72em; width: 10px; height: 2px; background: var(--bad); }
.evgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.evgrid.one { grid-template-columns: 1fr; }
.evcard { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); align-items: flex-start; }
.ev-t { display: flex; flex-direction: column; gap: 3px; }
.ev-t span { color: var(--ink-2); font-size: 13.5px; }
.ev-s { display: flex; flex-wrap: wrap; gap: 6px; }
.hist li a { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 12px 8px; margin: 0 -8px; border-radius: 9px; }
.hist li + li a { border-top: 1px solid var(--line-2); border-radius: 0; }
.hist li a:hover { background: var(--bg); }
.h-date { font-weight: 600; font-size: 13.5px; }
.h-main { display: flex; flex-direction: column; gap: 3px; }
.h-main span { color: var(--muted); font-size: 13.5px; }

/* ---------- visits ---------- */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs { display: inline-flex; gap: 4px; }
.tabs.solo { margin-bottom: 18px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; display: flex; width: fit-content; max-width: 100%; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border: 0; background: transparent; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab em { font-style: normal; font-size: 12px; background: var(--line-2); color: var(--ink-2); padding: 1px 7px; border-radius: 999px; }
.tab.on { background: var(--brand-soft); color: var(--brand-text); }
.tab.on em { background: var(--surface); color: var(--brand-text); }
.tab:hover:not(.on) { background: var(--bg); color: var(--ink); }
.sel select { min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.vday { padding: 14px 20px 6px; font-weight: 650; font-size: 13.5px; background: var(--surface-2); border-top: 1px solid var(--line-2); }
.vday span { color: var(--muted); font-weight: 500; margin-left: 4px; }
.vrow { display: grid; grid-template-columns: 52px minmax(0, 1.15fr) minmax(0, 1.5fr) 168px 112px 18px; gap: 14px; align-items: center; padding: 13px 20px; border-top: 1px solid var(--line-2); }
.vrow:hover { background: var(--bg); }
.v-time { font-weight: 650; }
.v-doc { display: flex; gap: 10px; align-items: center; min-width: 0; }
.v-doc > span:not(.avatar), .v-obj { display: flex; flex-direction: column; min-width: 0; }
.v-doc > span:not(.avatar) > span, .v-obj span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v-obj b { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; font-weight: 600; }
.vhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: start; }
.vhead p { color: var(--muted); margin-top: 6px; }
.vh-r { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.vh-doc { display: flex; gap: 10px; align-items: center; }
.vh-doc > span:not(.avatar) { display: flex; flex-direction: column; }
.vh-doc > span:not(.avatar) > span { color: var(--muted); font-size: 13px; }
.brief-p { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 14px; border-radius: 10px; background: var(--pcs); margin-top: 12px; }
.brief-p .persona { background: var(--surface); }
.brief-p > span:last-child { color: var(--ink-2); font-size: 14px; }
.must li { display: flex; gap: 10px; padding: 6px 0; align-items: flex-start; }
.must .ic { color: var(--ok); margin-top: 2px; }
.notes li.warn { display: flex; gap: 10px; padding: 10px 12px; border-radius: 9px; background: var(--warn-bg); color: var(--warn-ink); }
.notes .ic { margin-top: 2px; }
.sent { display: flex; align-items: center; gap: 12px; color: var(--brand-text); }
.sent span { color: var(--ink-2); font-weight: 600; }
.capture .hint { margin: 6px 0 14px; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 14px 0 0; border: 0; padding: 0; min-width: 0; }
.field > span, .field > legend { font-size: 13px; font-weight: 650; color: var(--ink-2); padding: 0; }
textarea, input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); resize: vertical; line-height: 1.45; }
textarea:focus, input[type=text]:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
.rads { display: flex; gap: 8px; flex-wrap: wrap; }
.rad { display: inline-flex; align-items: center; min-height: 38px; padding: 0 16px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; font-weight: 600; background: var(--surface); }
.rad input { position: absolute; opacity: 0; pointer-events: none; }
.rad.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-text); }
.rad:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; }

/* claim results */
.cr-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.cr { margin-top: 16px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.cr-list .cr { margin-top: 0; }
.cr.ok { display: flex; gap: 12px; align-items: flex-start; background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.cr.ok p { color: var(--ink-2); margin-top: 2px; }
.cr.high { border-left: 4px solid var(--bad); } .cr.medium { border-left: 4px solid var(--amb-bar); } .cr.low { border-left: 4px solid var(--slate-bar); }
.cr-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.cr-h code { background: var(--line-2); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; font-family: inherit; color: var(--ink-2); }
.cr p { color: var(--ink-2); }
.fix { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px dashed var(--line); }
.fix p { margin-top: 2px; color: var(--ink); }

/* ---------- source tags & popover ---------- */
.src { display: inline-flex; align-items: stretch; border: 1px solid var(--sc); border-radius: 6px; overflow: hidden; background: var(--surface); font-size: 12px; line-height: 1; cursor: pointer; padding: 0; max-width: 100%; }
.src b { white-space: nowrap; background: var(--sc); color: var(--on-s); padding: 6px 7px; font-weight: 650; }
.src span { padding: 6px 7px; color: var(--sc-text); font-weight: 600; white-space: nowrap; }
.src:hover { box-shadow: 0 0 0 2px var(--sc-ring); }
.src.flat { cursor: default; } .src.flat:hover { box-shadow: none; }
.s-E22 { --sc: var(--s-e22); --sc-text: var(--s-e22-t); --sc-ring: var(--s-e22-r); }
.s-E25 { --sc: var(--s-e25); --sc-text: var(--s-e25-t); --sc-ring: var(--s-e25-r); }
.s-CC { --sc: var(--s-cc); --sc-text: var(--s-cc-t); --sc-ring: var(--s-cc-r); }
.s-FC { --sc: var(--s-fc); --sc-text: var(--s-fc-t); --sc-ring: var(--s-fc-r); }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pop { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(8, 20, 30, .22); padding: 14px 16px; font-size: 13.5px; }
.pop[hidden] { display: none; }
.pop-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.pop-where { font-weight: 650; font-size: 15px; }
.pop-note { margin-top: 6px; color: var(--ink); }
.pop-cite { margin-top: 10px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.pop-pg { color: var(--muted); font-size: 12px; margin: 6px 0 10px; }

/* ---------- product / AI ---------- */
.how h2 { margin-bottom: 10px; }
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; counter-reset: r; }
.rules li { position: relative; padding-left: 30px; color: var(--ink-2); counter-increment: r; }
.rules li::before { content: counter(r); position: absolute; left: 0; top: 1px; width: 21px; height: 21px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-text); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.rules b { color: var(--ink); }
.sg + .sg { margin-top: 16px; }
.sg h3 { font-size: 13px; color: var(--ink-2); margin: 12px 0 8px; }
.turn { margin-bottom: 26px; }
.q { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-bottom: 12px; }
.q p { background: var(--brand); color: var(--brand-ink); padding: 10px 16px; border-radius: 16px 16px 4px 16px; max-width: min(560px, 92%); font-weight: 500; }
.thinking { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); padding: 10px 2px; }
.thinking span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: .4; animation: dot 1s infinite; }
.thinking span:nth-child(2) { animation-delay: .15s; } .thinking span:nth-child(3) { animation-delay: .3s; margin-right: 8px; }
@keyframes dot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
.ans { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px 18px; display: flex; flex-direction: column; gap: 16px; }
.ans > header { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.ans h3 { font-size: 19px; letter-spacing: -0.01em; line-height: 1.25; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.tag.covered { background: var(--ok-soft); color: var(--ok); }
.tag.partial { background: var(--amb-soft); color: var(--amb); }
.tag.notcovered { background: var(--slate-soft); color: var(--slate); }
.ans-body { font-size: 15px; line-height: 1.62; max-width: 76ch; color: var(--ink); }
.ans-body p + p, .ans-body p + ul, .ans-body ul + p { margin-top: 10px; }
.ans-body ul { margin: 8px 0; }
.ans-body li { position: relative; padding-left: 18px; margin: 5px 0; }
.ans-body li::before { content: ""; position: absolute; left: 4px; top: 0.72em; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); }
.say { padding: 12px 16px; border-left: 3px solid var(--brand); background: var(--brand-soft); border-radius: 0 9px 9px 0; }
.say p { margin-top: 4px; color: var(--ink); font-weight: 500; max-width: 74ch; }
.say .lbl { color: var(--brand-text); }
.ans .srcs { padding-top: 2px; }
.ans .srcs .lbl { margin-right: 4px; }
.limits { background: var(--warn-bg); border: 1px solid var(--warn-line); border-left-width: 5px; border-radius: 10px; padding: 14px 18px 12px; color: var(--warn-ink); }
.limits h4 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.limits .lbl { color: var(--warn-ink); opacity: .85; }
.limits .flist { margin: 2px 0 0; }
.lim-block + .lim-block { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--warn-line); }
.limits.compact { margin-top: 2px; }
.also, .follow, .closest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.also .lbl, .follow .lbl, .closest .lbl { margin-right: 4px; }
.ans-foot { display: flex; justify-content: flex-end; padding-top: 4px; border-top: 1px solid var(--line-2); margin-top: -2px; }
.ans-foot .btn { margin-top: 12px; }
.ans.nc { border-style: dashed; border-color: var(--slate-bar); background: var(--surface); }
.ans.nc .lead { font-size: 15.5px; max-width: 72ch; }
.related { padding: 12px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.related h4 { font-size: 13px; margin-bottom: 6px; }
.related p { color: var(--ink-2); margin-bottom: 8px; }
.next { color: var(--ink-2); }
.next b { color: var(--ink); }
.composer-wrap { position: sticky; bottom: 0; margin: 0 -28px -56px; padding: 14px 28px calc(18px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 22%); z-index: 5; }
.composer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
.cmp-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; }
.cmp-chips .chip { white-space: nowrap; flex: none; }
.cmp-row { display: flex; gap: 8px; align-items: center; }
.cmp-row input { border: 1px solid transparent; background: var(--bg); min-height: 44px; }
.cmp-row .btn.primary { min-height: 44px; }

.table-wrap { overflow-x: auto; max-width: 100%; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 12px 16px; border-top: 1px solid var(--line-2); }
.tbl thead th { border-top: 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12.5px; font-weight: 650; background: var(--surface-2); white-space: nowrap; }
.tbl tbody th { font-weight: 650; min-width: 170px; }
.tbl tbody th span { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; margin-top: 2px; }
.tbl td { color: var(--ink-2); }
.tbl td { min-width: 120px; }
.tbl td .srcs { gap: 5px; min-width: 210px; }
.open-pts { margin-top: 8px; }
.open-pts li { position: relative; padding-left: 14px; font-size: 12.5px; color: var(--amb); margin: 3px 0; }
.open-pts li::before { content: ""; position: absolute; left: 2px; top: .6em; width: 5px; height: 5px; background: var(--amb); border-radius: 1px; transform: rotate(45deg); }
.cant li { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line-2); }
.cant li:first-child { border-top: 0; }
.cant li div { display: flex; flex-direction: column; }
.cant li span { color: var(--muted); font-size: 13.5px; }
.docgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
.doc { margin-bottom: 0; display: flex; flex-direction: column; gap: 12px; border-top: 4px solid var(--sc); }
.doc-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cite { color: var(--ink-2); font-size: 13.5px; line-height: 1.5; }
.dcols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dcols h3 { font-size: 13px; margin-bottom: 6px; color: var(--ink-2); }
.dcols li { position: relative; padding-left: 14px; margin: 5px 0; font-size: 13.5px; color: var(--ink-2); }
.dcols li::before { content: ""; position: absolute; left: 2px; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--sc); }
.slide { border-top: 1px solid var(--line-2); padding: 12px 0; }
.slide:first-of-type { border-top: 0; }
.slide summary { display: flex; align-items: center; gap: 12px; cursor: pointer; flex-wrap: wrap; list-style: none; }
.slide summary::-webkit-details-marker { display: none; }
.slide summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; margin-right: 2px; }
.slide[open] summary::before { transform: rotate(45deg); }
.sn { font-weight: 650; color: var(--s-fc-t); width: 56px; flex: none; }
.st { font-weight: 600; flex: 1; min-width: 160px; }
.sflag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--amb); font-weight: 600; }
.sflag .ic { width: 14px; height: 14px; }
.slide p { margin: 10px 0 2px 70px; color: var(--ink-2); max-width: 78ch; }


/* ---------- findings (knowledge base rows) ---------- */
.ans .lead { display: flex; flex-direction: column; gap: 4px; font-size: 16.5px; line-height: 1.5; font-weight: 500; max-width: 74ch; color: var(--ink); }
.ans.nc .lead { display: block; font-weight: 400; font-size: 15.5px; }
.fnd h4, .avoid h4, .related h4 { display: flex; align-items: baseline; gap: 10px; font-size: 13px; font-weight: 650; color: var(--ink-2); margin-bottom: 4px; }
.fnd h4 em { font-style: normal; font-weight: 500; color: var(--muted); }
.flist { margin: 0; }
.fr { position: relative; padding: 11px 0 11px 20px; border-top: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 7px; }
.fr:first-child { border-top: 0; }
.fr::before { content: ""; position: absolute; left: 4px; top: 1.15em; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
.fr.k-claim::before { background: transparent; border: 2px solid var(--amb-bar); }
.fr.k-note::before { border-radius: 2px; transform: rotate(45deg); background: var(--slate-bar); }
.fr.k-limit::before { background: var(--amb-bar); border-radius: 2px; transform: rotate(45deg); }
.fr-x { font-size: 15px; line-height: 1.55; max-width: 78ch; }
.fr-s { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fid { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: .01em; }
.kd { display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 5px; font-size: 11.5px; font-weight: 650; vertical-align: 1px; line-height: 1.5; }
.kd-claim { background: var(--amb-soft); color: var(--amb); }
.kd-note { background: var(--slate-soft); color: var(--slate); }
.kd-limit { background: var(--amb-soft); color: var(--amb); }
.limits .fr { border-top-color: var(--warn-line); padding: 8px 0 8px 18px; }
.limits .fr::before { background: var(--warn-ink); border: 0; border-radius: 1px; transform: rotate(45deg); width: 6px; height: 6px; top: 1.05em; }
.limits .fr-x { font-size: 14px; line-height: 1.5; color: var(--warn-ink); }
.limits .kd { background: rgba(0,0,0,.07); color: var(--warn-ink); }
.limits .src b, .limits .src span { padding: 4px 6px; font-size: 11.5px; }
.limits .fid { display: none; }
.related .flist .fr:first-child { padding-top: 6px; }
.avoid { padding: 12px 16px; border-radius: 10px; background: var(--bad-soft); }
.avoid h4 { color: var(--bad); }
.avoid li { display: flex; flex-direction: column; gap: 6px; padding: 9px 0; border-top: 1px solid rgba(0,0,0,.08); font-size: 14.5px; }
.avoid li:first-child { border-top: 0; }
.pop-lbl { margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.pop-lbl + .pop-note { margin-top: 2px; }

/* knowledge base browser */
.kb-legend { margin-top: 10px; line-height: 1.6; max-width: 90ch; }
.kb-legend b { color: var(--ink-2); font-weight: 650; }
.kb-filters { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.kb-row2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kb-row2 input { flex: 1; min-width: 220px; }
.chip.fil { min-height: 34px; gap: 8px; }
.chip.fil em { font-style: normal; font-size: 12px; background: var(--line-2); color: var(--ink-2); padding: 0 7px; border-radius: 999px; }
.chip.fil.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-text); font-weight: 600; }
.chip.fil.on em { background: var(--surface); }
#kbCount { margin-top: 12px; }
.kblist { margin: 0; }
.kbrow { display: grid; grid-template-columns: 70px 108px minmax(0, 1fr) minmax(190px, 290px); gap: 6px 16px; padding: 13px 22px; border-top: 1px solid var(--line-2); align-items: start; }
.kbrow:first-child { border-top: 0; }
.kb-id { font-weight: 650; font-size: 13px; color: var(--ink-2); }

  { n: 1, title: 'Flash cards (title slide)', body: 'Title slide only.' },
  { n: 2, title: 'Probiotics in diabetic CKD', body: 'Liu et al. (Front Microbiol, 2026) systematic review and meta-analysis of probiotics in diabetic kidney disease. Markers: serum creatinine, 24-hr UPCR, eGFR, BUN. RCT data over 8–12 weeks; serum creatinine range 0.9 to 3.3 mg/dl; GFR improvement +4.21 (interval shown: −2.86 to 11.28). Summary on the card: probiotics improve renal function, glycaemic control, lipid metabolism and inflammation/oxidative stress in DKD.', flag: 'The interval shown for GFR crosses zero.' },
  { n: 3, title: 'Pre- and probiotics in CKD: evidence timeline', body: 'Non-dialysis CKD, 4 RCTs + 2 meta-analyses. Week 2: stool Bifidobacterium rises, symptoms improve, no change yet in toxins or eGFR. Week 4: p-cresol early downward trend (not significant). Week 6: p-cresol −14 µmol/L (p<0.05), intestinal permeability improves. Week 8: eGFR +8.4 mL/min (p<0.05), hsCRP down (p<0.005), albumin up, constipation and abdominal pain improve. Week 12: eGFR gain sustained (+8.1, p<0.005); indoxyl sulfate −21.5%; hsCRP −39.5%. Month 6: BUN down (p=0.02). Largest meta-analysis (n=867): pooled eGFR not significant. Caution: antibiotics negate benefit.', flag: 'Pooled eGFR was not significant in the largest meta-analysis.' },

/* ==========================================================================
   Engine: maps a free-text question to a curated, cited answer — or says
   clearly that the documents do not cover it. It never generates new facts.
   ========================================================================== */

function normaliseQuestion(q) {
  let s = String(q || '').replace(/\bIS\b/g, 'indoxyl sulfate');   // upper-case IS only
  s = s.toLowerCase();
  s = s.replace(/zavetox|nitro ?trim/g, 'the product');
  s = s.replace(/mylin( biotech)?|eldroga/g, 'the company');
  s = s.replace(/[\u201c\u201d"]/g, '').replace(/\s+/g, ' ').trim();
  return s;
}

function scoreEntry(s, entry) {
  if (entry.need && !entry.need.test(s)) return 0;
  let total = 0;
  for (const pair of entry.re) {
    if (pair[0].test(s)) total += pair[1];
  }
  return total;
}

function askDocuments(question) {
  const s = normaliseQuestion(question);
  if (s.length < 2) return { kind: 'empty', q: question };

  const hits = TOPICS.map(function (e) { return { e: e, sc: scoreEntry(s, e) }; })
    .filter(function (x) { return x.sc > 0; })
    .sort(function (a, b) { return b.sc - a.sc; });
  const ncHits = NOT_COVERED.map(function (e) { return { e: e, sc: scoreEntry(s, e) }; })
    .filter(function (x) { return x.sc > 0; })
    .sort(function (a, b) { return b.sc - a.sc; });

  const top = hits[0];
  const nc = ncHits[0];

  // Not-covered topics win ties: when in doubt, do not answer.
  if (nc && (!top || nc.sc >= top.sc)) {
    return { kind: 'notcovered', q: question, nc: nc.e, closest: [] };
  }

  if (top && top.sc >= 2) {
    const also = hits.slice(1).filter(function (x) { return x.sc >= 2 && x.sc >= top.sc * 0.6; }).slice(0, 2).map(function (x) { return x.e; });
    return { kind: top.e.kind, q: question, entry: top.e, also: also };
  }

  // Nothing solid: do not guess. Offer the closest topics and any findings that share terms.
  return {
    kind: 'notcovered', q: question, nc: null,
    closest: hits.slice(0, 2).map(function (x) { return x.e; }),
    related: relatedFindings(s)
  };
}

    // a caveat limits a claim ("has not been measured"), except "no side effects / no adverse events", which is itself a safety claim
    const caveat = CAVEAT.test(s) && !/\bno (side[- ]effects?|adverse)\b/i.test(s);
    const row = { i: i, text: s, voice: voice, ask: ask, caveat: caveat, flagIds: [], supported: false, anecdote: false, ae: false };
    rows.push(row);
    // notes that are not claims: patient anecdotes and possible adverse events
    if (!ask && ANECDOTE.test(s)) { row.anecdote = true; notes.push({ kind: 'anecdote', sentence: s, i: i }); }
    if (/\b(patients?)\b/i.test(s) && AE_WORD.test(s) && !caveat) { row.ae = true; notes.push({ kind: 'ae', sentence: s, i: i }); }
    if (row.anecdote && voice !== 'rep') return;   // a patient anecdote the doctor reported is not a claim by the rep
    if (row.anecdote && voice === 'rep' && !caveat) {
      flags.push({ kind: 'unverified', ruleId: 'anecdote', label: 'Patient anecdote presented as evidence', pri: 'Medium', match: '', why: 'Patient feedback is not trial evidence, and the documents report no clinical outcomes.',
        fix: 'Record it as unsolicited feedback and refer to the trial results instead.', ids: ['E22-39'], src: [], sentence: s, i: i });
      row.flagIds.push('anecdote'); return;
    }
    if (caveat && voice !== 'doctor' && !ask) {
      // an honest limit that the knowledge base backs up counts as a supported statement
      const cres = askDocuments(s);
      if (cres.kind !== 'notcovered') { supported.push({ sentence: s, topic: cres.entry, ids: cres.entry.f.slice(0, 3), i: i }); row.supported = true; }
      return;
    }
    if (ask || caveat || voice === 'doctor') return;
    if (voice === 'neutral' && !PRODUCT_REF.test(s)) return;
    let flagged = false;
    CLAIM_RULES.forEach(function (r) {
      const m = s.match(r.re);
      if (m) { flags.push({ kind: 'overclaim', ruleId: r.id, label: r.label, pri: r.sev, match: m[0], why: r.why, fix: r.fix, ids: r.ids || [], src: r.src || [], sentence: s, i: i }); flagged = true; row.flagIds.push(r.id); }
    });
    if (ASSERT.test(s)) {
      const norm = normaliseQuestion(s);
      let best = null;
      NOT_COVERED.forEach(function (n) { const sc = scoreEntry(norm, n); if (sc >= 3 && (!best || sc > best.sc)) best = { n: n, sc: sc }; });
      if (best) {
        flags.push({ kind: 'unsupported-topic', ruleId: best.n.id, label: 'Not covered by the knowledge base', pri: ['nc_special', 'nc_contra', 'nc_events'].indexOf(best.n.id) > -1 ? 'High' : 'Medium', match: '',
          why: 'The knowledge base does not cover ' + best.n.topic + ', so this statement has no supporting evidence.',
          fix: 'Say that this is not covered in the documents and offer a Medical Affairs follow-up.', ids: best.n.rel || [], src: [], sentence: s, i: i });
        flagged = true; row.flagIds.push(best.n.id);
      }
    }
    const res = askDocuments(s);
    const entry = res.kind === 'notcovered' ? null : res.entry;
    if (isProductAssertion(s)) {
      const pool = kbNumbers(entry);
      extractFigures(s).forEach(function (f) {
        if (!pool.some(function (n) { return Math.abs(n - f.v) < 1e-9; })) {
          flags.push({ kind: 'figure', ruleId: 'figure', label: 'Figure not found in the knowledge base', pri: 'High', match: f.text,
            why: '\u201c' + f.text + '\u201d does not appear in the findings' + (entry ? ' on this topic (' + entry.title.replace('{P}', 'the product') + ')' : '') + '.',
            fix: 'Quote only figures the documents report, with their basis.', ids: entry ? entry.f.slice(0, 3) : [], src: [], sentence: s, i: i });
          flagged = true; row.flagIds.push('figure');
        }
      });
    }
    if (!flagged) {
      if (entry) { supported.push({ sentence: s, topic: entry, ids: entry.f.slice(0, 3), i: i }); row.supported = true; }
      else if (isProductAssertion(s)) {
        flags.push({ kind: 'unverified', ruleId: 'unverified', label: 'Not found in the knowledge base', pri: 'Medium', match: '',
          why: 'No finding in the knowledge base supports this statement.', fix: 'Rephrase to what the documents report, or send it as a scientific question.', ids: [], src: [], sentence: s, i: i });
        row.flagIds.push('unverified');
      }
    }
  });
  return { sentences: rows, flags: flags, supported: supported, notes: notes };
}

/* Original API, now built on the sentence analysis. */
function checkClaims(text) {
  const a = analyseClaims(text);
  const out = a.flags.map(function (f) { return { id: f.ruleId, sev: f.pri, label: f.label, match: f.match || '', why: f.why, fix: f.fix, src: f.src || [], sentence: f.sentence }; });
  const t = a.sentences.filter(function (r) { return !r.ask && !r.caveat && r.voice !== 'doctor'; }).map(function (r) { return r.text; }).join(' ');
  const efficacy = /\b(reduc\w*|lower\w*|decreas\w*|improv\w*|fall|fell|drop\w*|\d+\s?%)\b/i.test(t);
  const balance = /\b(limitation|small|50 (patients|completers)|12[- ]weeks?|90[- ]days?|cochrane|uncertain|larger|longer studies|validation)\b/i.test(t);
  if (efficacy && !balance) {
    out.push({ id: 'balance', sev: 'Medium', label: 'Efficacy without limitations', match: '',
      why: 'An efficacy statement should be presented with the study\u2019s limits.',
      fix: 'Add the key limits: 50 completers, 12 weeks, and that Cochrane rates the wider evidence as uncertain.', src: [['E22', '18'], ['CC', '32']] });
  }
  return out;
}

  return tpl.replace(/\{DR\}/g, d.name).replace(/\{P\}/g, product || 'the product').replace(/\{(He|he|his|him)\}/g, function (m, k) { return pr[k]; });

const NO_ANSWER_LINE = 'That isn\u2019t covered in the evidence I have, so I don\u2019t want to guess. I\u2019ll check with Medical Affairs and come back to you.';

function briefRouteKey(res) { return res.kind === 'notcovered' ? 'nc:' + (res.nc ? res.nc.id : 'generic') : res.entry.id; }

/* Answer for one likely question, built from the engine and the findings. */
function briefAnswer(q) {
  const res = askDocuments(q);
  if (res.kind === 'notcovered') {
    return { kind: 'notcovered', topic: res.nc ? res.nc.topic : null, say: NO_ANSWER_LINE,
      rel: res.nc && res.nc.rel ? res.nc.rel.slice(0, 3) : [], limits: CORE_IDS.slice(0, 2), key: briefRouteKey(res) };
  }
  const t = res.entry;
  const main = t.f.slice(0, 3);
  let limits = t.l.filter(function (id) { return t.f.indexOf(id) < 0 && CORE_IDS.indexOf(id) < 0; }).slice(0, 3);
  if (!limits.length) limits = CORE_IDS.filter(function (id) { return t.f.indexOf(id) < 0; }).slice(0, 2);
  return { kind: res.kind, topicId: t.id, title: t.title, lead: t.lead, say: t.say || null, findings: main, limits: limits, key: briefRouteKey(res) };
}

/* Build the briefing for a doctor (and optionally a visit). */
function buildBriefing(doctor, visit) {
  const cfg = BRIEF_PERSONA[doctor.persona];
  const bring = (visit && visit.bring) || [];

  // ---- talking points: persona priority + visit agenda + doctor's usual topics
  let cand = cfg.pool.map(function (id, idx) {
    const tp = TALK_BY[id]; let sc = 100 - idx * 6;
    if (cfg.must.indexOf(id) > -1) sc += 1000;
    if (tp.topics.some(function (t) { return bring.indexOf(t) > -1; })) sc += 55;
    if (tp.topics.some(function (t) { return doctor.evidence.indexOf(t) > -1; })) sc += 6;
    return { tp: tp, idx: idx, sc: sc };
  }).sort(function (a, b) { return b.sc - a.sc; });
  let chosen = cand.slice(0, cfg.points), rest = cand.slice(cfg.points);
  ['limits', 'result'].forEach(function (tag) {
    if (!chosen.some(function (c) { return c.tp.tags.indexOf(tag) > -1; })) {
      const add = rest.filter(function (c) { return c.tp.tags.indexOf(tag) > -1; })[0];
      if (add) { chosen.sort(function (a, b) { return a.sc - b.sc; }); const out = chosen.shift(); chosen.push(add); rest = rest.filter(function (c) { return c !== add; }).concat([out]); }
    }
  });
  const points = chosen.sort(function (a, b) { return a.idx - b.idx; }).map(function (c) { return c.tp; });

  // ---- likely questions: persona pool + doctor's usual questions + visit agenda
  const seen = {}, qc = [];
  const add = function (q, why, base) {
    const key = briefRouteKey(askDocuments(q));
    const inVisit = visit && visit.ask && visit.ask.indexOf(q) > -1;
    const inDoc = doctor.questions.indexOf(q) > -1;
    const sc = base + (inVisit ? 40 : 0) + (inDoc ? 25 : 0);
    if (!seen[key] || seen[key].sc < sc) { seen[key] = { q: q, why: why, sc: sc, key: key }; }
  };
  cfg.questions.forEach(function (x, i) { add(x.q, x.why, 60 - i * 6); });
  doctor.questions.forEach(function (q) { add(q, 'Raised or likely, from this doctor\u2019s profile.', 30); });
  ((visit && visit.ask) || []).forEach(function (q) { add(q, 'On the agenda for this visit.', 30); });
  const questions = Object.keys(seen).map(function (k) { return seen[k]; }).sort(function (a, b) { return b.sc - a.sc; }).slice(0, 5).map(function (x) {
    return { q: x.q, why: x.why, answer: briefAnswer(x.q) };
  });

  // ---- findings used (for the "built from" count)
  const used = {};
  CORE_IDS.forEach(function (i) { used[i] = 1; });
  points.forEach(function (p) { p.backed.concat(p.limits).forEach(function (i) { used[i] = 1; }); });
  questions.forEach(function (x) {
    const a = x.answer; (a.findings || []).concat(a.limits || [], a.rel || []).forEach(function (i) { used[i] = 1; });
  });

  return {
    doctorId: doctor.id, persona: doctor.persona, visitId: visit ? visit.id : null,
    approach: { headline: cfg.headline, time: cfg.time, steps: cfg.steps, avoid: cfg.avoid, watch: doctor.concerns },
    points: points, questions: questions, core: CORE_IDS.slice(), findingCount: Object.keys(used).length
  };
}

function makeConcern(text, imp, cat) {
  const res = askDocuments(text);
  return { id: 'c' + Date.now() + Math.floor(Math.random() * 1000), text: text, cat: cat || categorise(text), imp: imp,
    kb: res.kind, topic: res.entry ? res.entry.title : (res.nc ? res.nc.topic : null), topicId: res.entry ? res.entry.id : null };
}
function workFor(v) {
  if (!state.work[v.id]) {
    const w = { result: v.result || null, interest: v.interest ? interestLabel(v.interest) : null, summary: v.status === 'completed' ? v.outcome : '', concerns: [], actions: {}, draft: { text: '', cat: 'Clinical Evidence', imp: 'Medium' } };
    if (v.status === 'completed') (v.requests || []).forEach(function (r, i) { w.concerns.push(makeConcern(r, i === 0 ? 'High' : 'Medium')); });
    state.work[v.id] = w;
  }
  return state.work[v.id];
}
const IMP_ORDER = { High: 0, Medium: 1, Low: 2 };
function analyseVisit(v) {
  const w = workFor(v);
  const sorted = w.concerns.slice().sort(function (a, b) { return IMP_ORDER[a.imp] - IMP_ORDER[b.imp]; });
  const primary = sorted[0] || null;
  const interestText = { 'High Interest': 'High: engaged and asking how to use it', 'Moderate Interest': 'Moderate: open to the concept, needs more evidence', 'Low Interest': 'Low: sceptical, needs a stronger scientific case', 'Not Interested': 'Not interested: no immediate opportunity' }[w.interest] || 'Not recorded yet';
  const barrierByCat = { 'Clinical Evidence': 'Strength and applicability of the available evidence', 'Patient Selection': 'Clarity on which patients to treat', 'Product Comparison': 'No head-to-head data in the documents', 'Safety & Tolerability': 'No safety results in the documents', 'Dialysis Outcomes': 'Dialysis outcomes were not measured', 'Other': 'To be clarified with the doctor' };
  const uncovered = w.concerns.filter(function (c) { return c.kb === 'notcovered'; });
  return { w: w, primary: primary, interestText: interestText, barrier: primary ? barrierByCat[primary.cat] : null, uncovered: uncovered };
}
function nextActions(v) {
  const a = analyseVisit(v); const out = [];
  const topic = a.primary ? lowerFirst(sub(a.primary.topic || a.primary.text)) : 'the questions raised';
  out.push({ key: 'evidence', title: 'Share Relevant Evidence', tag: 'High priority', tagCls: 'bad', btn: 'Prepare Evidence Package',

  out.push({ key: 'followup', title: 'Schedule Scientific Follow-Up', tag: 'Within 7\u201314 days', tagCls: 'brand', btn: 'Create Follow-Up',
    text: 'Plan a follow-up on ' + topic + ' and patient selection.' });
  if (a.uncovered.length) out.push({ key: 'sciq', title: 'Assign Scientific Question', tag: 'Needs review', tagCls: 'amb', btn: 'Send for Review',
    text: 'Submit ' + (a.uncovered.length === 1 ? 'the question the knowledge base cannot answer' : a.uncovered.length + ' questions the knowledge base cannot answer') + ' for medical and scientific review.' });

    text: a.primary ? 'New insight: ' + a.primary.text + ' (' + a.primary.imp.toLowerCase() + ' importance).' : 'Add the key insight from this visit to the profile.' });
  return out;
}

function doNextAction(v, key) {

function savePostVisit(v) {

    case 'live-reset': state.live.confirmReset = true; renderPage(true); break;
    case 'live-reset-cancel': state.live.confirmReset = false; renderPage(true); break;
    case 'live-reset-confirm': liveReset(); break;
    case 'live-retry': state.live.down = false; state.live.insightFor = null; state.live.msg = null; liveEnsure(); break;
    case 'vs-tab': state.visitsTab = id; renderPage(true); break;
    case 'vs-goto': state.visitsTab = id; state.visitsSticky = true; break;
    case 'vf': state.visitFilter = id; renderPage(true); break;
    case 'ws-tab': state.wsTab = id; renderPage(false); break;
    case 'confirm-visit': { const v = visitById(id); v.status = 'scheduled'; renderPage(true); toast('Visit confirmed'); break; }
    case 'post-result': { const v = visitById(t.dataset.v); workFor(v).result = id; renderPage(true); break; }
    case 'post-interest': { const v = visitById(t.dataset.v); workFor(v).interest = id; renderPage(true); break; }
    case 'post-check': {
      const v = visitById(id); const w = workFor(v); w.summary = $('#postSummary').value;
      $('#postResult').innerHTML = w.summary.trim() ? claimResultHTML(checkClaims(w.summary)) : '<p class="empty">Add a summary first.</p>'; break;
    }
    case 'post-save': {
      const v = visitById(id); const w = workFor(v); w.summary = $('#postSummary').value;
      const r = savePostVisit(v);
      if (!r.ok) { $('#postResult').innerHTML = '<p class="form-err" role="alert">' + esc(r.msg) + '</p>'; break; }
      state.wsTab = 'concerns'; renderPage(true); toast(r.flagged ? 'Visit saved. ' + r.flagged + ' scientific claim' + (r.flagged > 1 ? 's' : '') + ' flagged for review.' : 'Visit summary saved'); break;
    }
    case 'concern-add': {
      const v = visitById(id); const w = workFor(v); const txt = ($('#cText').value || '').trim();
      if (!txt) { $('#cMsg').textContent = 'Describe the question or objection first.'; break; }
      w.concerns.push(makeConcern(txt, $('#cImp').value, $('#cCat').value)); w.draft = { text: '', cat: 'Clinical Evidence', imp: 'Medium' }; renderPage(true); toast('Concern added'); break;
    }
    case 'concern-del': { const v = visitById(t.dataset.v); const w = workFor(v); w.concerns = w.concerns.filter(function (c) { return c.id !== id; }); renderPage(true); break; }
    case 'act-do': { const v = visitById(t.dataset.v); doNextAction(v, id); renderPage(true); break; }
    case 'fu-done': { const f = state.followups.find(function (x) { return x.id === id; }); if (f) { f.status = 'Done'; logActivity('Follow-Up Completed', f.act + ' was marked as done.', 'COMPLIANT'); renderPage(true); toast('Follow-up marked as done'); } break; }
    case 'sq-answer': { const q = state.sciQs.find(function (x) { return x.id === id; }); if (q) { q.status = q.status === 'Awaiting evidence review' ? 'In review' : 'Answered'; renderPage(true); toast('Status: ' + q.status); } break; }
    /* compliance */
    case 'flag-act': {
      const f = state.flags.find(function (x) { return x.id === id; }); if (!f) break;
      if (f.action === 'doc') { const v = visitById(f.ref); state.wsTab = 'post'; state.wsVisit = f.ref; goTo('#/visits/' + f.ref); state.wsTab = 'post'; renderPage(false); break; }
      f.status = 'Resolved';
      if (f.action === 'followup') { const fu = state.followups.find(function (x) { return x.id === f.ref; }); if (fu) fu.status = 'Reviewed'; }
      logActivity(f.cat === 'Scientific Communication' ? 'Scientific Evidence Reviewed' : 'Follow-Up Reviewed', f.title + ' was reviewed and resolved.', 'COMPLIANT');
      renderPage(true); toast('Resolved'); break;
    }
    case 'claim-example': { const ta = $('#claimText'); ta.value = co().product + ' is proven safe and delays dialysis, and it is better than other probiotics.'; ta.focus(); break; }
    case 'claim-check': { const txt = $('#claimText').value; $('#claimResult').innerHTML = txt.trim() ? claimResultHTML(checkClaims(txt)) : '<p class="empty">Paste some text first.</p>'; break; }
    default: break;
  }
});
document.addEventListener('change', function (e) {

function weekWindow() { const d = pd(TODAY).getDay(); const start = addDays(TODAY, -((d + 6) % 7)); return { start: start, end: addDays(start, 6) }; }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function to12h(t) { const p = t.split(':'); let h = +p[0]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + p[1] + ' ' + ap; }

function actionWhen(a) { const v = visitById(a.visit); return v ? rel(v.date) + ' \u00b7 ' + to12h(v.time) : ''; }
function pageDashboard() {
  const today = state.visits.filter(function (v) { return v.date === TODAY; }).sort(function (a, b) { return a.time < b.time ? -1 : 1; });

  const oppFU = state.opps.filter(function (o) { return o.followUp; });
  const sq = openSciQs(); const sqAwait = sq.filter(function (q) { return q.status === 'Awaiting evidence review'; });
  const flags = openFlags(); const score = complianceScore(); const soon = dueSoon();

  const kcards = [
    { v: today.length, l: 'Today\u2019s Visits', s: plural(later.length, 'visit', 'visits') + ' scheduled later today', href: '#/visits', act: 'vs-goto', id: 'visits' },
    { v: state.opps.length, l: 'Total Open Opportunities', s: plural(oppFU.length, 'opportunity requires', 'opportunities require') + ' follow-up', href: '#/doctors', act: 'go' },
    { v: sq.length, l: 'Open Scientific Questions', s: plural(sqAwait.length, 'question', 'questions') + ' awaiting evidence review', href: '#/visits', act: 'vs-goto', id: 'questions' },
    { v: score + '%', l: 'Compliance Status', s: plural(flags.length, 'item requires', 'items require') + ' attention', href: '#/compliance', act: 'go' }
  ].map(function (k) {
    return '<a class="kcard" href="' + k.href + '" data-act="' + k.act + '"' + (k.id ? ' data-id="' + k.id + '"' : '') + '><span class="k-v">' + k.v + '</span><span class="k-l">' + k.l + '</span><span class="k-s">' + k.s + '</span></a>';
  }).join('');

  const alerts = [
    { t: 'New Evidence Available', b: 'New', c: 'brand', x: 'Knowledge base updated: ' + FINDINGS.length + ' findings from four documents, each with its page or slide.', href: '#/product/detail', act: 'open-kb' },
    { t: 'Scientific Question Pending', b: 'Pending', c: 'amb', x: plural(sq.length, 'scientific query is', 'scientific queries are') + ' awaiting evidence validation.', href: '#/visits', act: 'vs-goto', id: 'questions' },
    { t: 'Compliance Action Required', b: 'Action required', c: 'bad', x: plural(flags.length, 'activity requires', 'activities require') + ' review or additional documentation.', href: '#/compliance', act: 'go' },
    { t: 'Follow-Up Reminder', b: 'Upcoming', c: 'plain', x: plural(soon.length, 'follow-up activity is', 'follow-up activities are') + ' due within the next 48 hours.', href: '#/visits', act: 'vs-goto', id: 'followups' }
  ].map(function (a) {
    return '<li><a class="alert-row" href="' + a.href + '" data-act="' + a.act + '"' + (a.id ? ' data-id="' + a.id + '"' : '') + '><span class="al-t"><b>' + a.t + '</b><span>' + a.x + '</span></span>' + badge(a.b, a.c) + '</a></li>';
  }).join('');

  const w = weekWindow();
  const inWeek = state.visits.filter(function (v) { return v.date >= w.start && v.date <= w.end; });
  const doneWeek = inWeek.filter(function (v) { return v.status === 'completed'; });
  const avgProg = state.opps.length ? Math.round(state.opps.reduce(function (a, o) { return a + o.progress; }, 0) / state.opps.length) : 0;
  const answered = state.sciQs.filter(function (q) { return q.status === 'Answered'; });
  const fuDone = state.followups.filter(function (f) { return f.status === 'Done' || f.status === 'Reviewed'; });
  const weekly = [
    { p: pct(doneWeek.length, inWeek.length), l: 'Visits Completed', d: doneWeek.length + ' of ' + inWeek.length + ' this week' },
    { p: avgProg, l: 'Sales Opportunities Progress', d: 'Average across ' + state.opps.length + ' open opportunities' },
    { p: pct(answered.length, state.sciQs.length), l: 'Scientific Questions Resolved', d: answered.length + ' of ' + state.sciQs.length + ' resolved' },
    { p: pct(fuDone.length, state.followups.length), l: 'Follow-Ups Completed', d: fuDone.length + ' of ' + state.followups.length + ' completed' }
  ].map(function (x) {
    return '<li><div class="wk-h"><span class="wk-p">' + x.p + '%</span><span class="wk-l">' + x.l + '</span></div><div class="bar" aria-hidden="true"><i style="width:' + x.p + '%"></i></div><span class="wk-d">' + x.d + '</span></li>';

  const todayHTML = today.length ? today.map(function (v) {
    const d = docById(v.doc);
    return '<a class="trow" href="#/visits/' + v.id + '" data-act="go"><span class="t-time">' + to12h(v.time) + '</span>' + avatar(d) +
      '<span class="t-main"><b>' + d.name + '</b>' + personaChip(d.persona) + '<span>' + esc(v.objective) + '</span></span>' + icon('chevron', 'muted') + '</a>';
  }).join('') : '<p class="empty">No visits today.</p>';
  const actions = ACTIONS.map(function (a) {

    return '<li><a href="#/visits/' + a.visit + '" data-act="go"><span class="nb-when">' + actionWhen(a) + '</span><span class="nb-text"><b>' + d.name + '.</b> ' + esc(a.text) + '</span>' + icon('chevron', 'muted') + '</a></li>';

    '</div>' +

      '<section class="card"><div class="card-h">' + eyebrow('Today\u2019s Visits') + '<a href="#/visits" data-act="go" class="link">All visits</a></div>' + todayHTML + '</section>' +
      '<section class="card"><div class="card-h">' + eyebrow('Next Best Actions') + '</div><ul class="nba">' + actions + '</ul></section>' +
    '</div>';
}

  }).join('');

}

/* ======================================================== VISIT BRIEFING */
function srcLabel(x) { const d = DOCS[x[0]]; return d.short + ', ' + (d.pageWord === 'slide ' ? 'slide ' + x[1] : 'p.' + x[1]); }
function srcLabels(ids) {
  const seen = {}, out = [];
  ids.forEach(function (id) { const f = FIND[id]; if (!f) return; f.s.forEach(function (x) { const k = x[0] + '|' + x[1]; if (!seen[k]) { seen[k] = 1; out.push(srcLabel(x)); } }); });
  return out;
}
function briefVisitFor(d, st) {
  if (!st || !st.visit || st.visit === 'none') return null;
  const v = visitById(st.visit);
  return v && v.status !== 'completed' ? v : null;
}
function briefLoadingHTML() {
  return '<section class="card brief" id="brief" aria-busy="true"><div class="brief-load" role="status"><span class="spin" aria-hidden="true"></span><div><b>Preparing the briefing</b><p>Matching the persona to findings in the knowledge base, and answering the likely questions from it.</p></div></div>' +
    '<div class="skel"><i></i><i></i><i></i></div></section>';
}
function logBrief(d, st) {
  const v = briefVisitFor(d, st); const b = buildBriefing(d, v);
  const nc = b.questions.filter(function (x) { return x.answer.kind === 'notcovered'; }).length;
  const now = new Date(); const pad = function (n) { return (n < 10 ? '0' : '') + n; };
  state.aiLog.push({ t: TODAY + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()), q: 'Visit briefing prepared for ' + d.name, kind: 'covered', briefing: true,
    topic: b.points.length + ' talking points, ' + b.questions.length + ' answers' + (nc ? ' (' + nc + ' declined as not covered)' : '') });
}
function startBrief(docId, visitId) {
  const d = docById(docId); if (!d) return;
  const nv = nextVisit(docId);
  state.briefs[docId] = { visit: visitId !== undefined ? visitId : (nv ? nv.id : 'none'), loading: true };
  const here = state.route.name === 'doctors' && state.route.id === docId;
  if (here) { renderPage(true); const el = $('#brief'); if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' }); } else { location.hash = '#/doctors/' + docId; }
  setTimeout(function () {
    const st = state.briefs[docId]; if (!st || !st.loading) return;
    st.loading = false; logBrief(d, st);
    if (state.route.name === 'doctors' && state.route.id === docId) {
      renderPage(true);
      const el = $('#brief'); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }
  }, 750);
}

function bsecHead(n, title, extra) {
  return '<h3>' + (n ? '<span class="bn">' + n + '</span>' : '') + title + (extra || '') + '</h3>';
}
function renderApproach(b, v, n) {

    '<p class="b-head">' + esc(b.approach.headline) + '</p><p class="hint">' + esc(b.approach.time) + '</p>' +
    (v && v.open ? '<div class="b-open"><span class="lbl">Opening for this visit</span><p>' + esc(v.open) + '</p></div>' : '') +
    '<ol class="stepcards">' + b.approach.steps.map(function (s, i) { return '<li><span class="s2-n">' + (i + 1) + '</span><div><b>' + esc(s.t) + '</b><span>' + esc(s.d) + '</span></div></li>'; }).join('') + '</ol>' +
    '<div class="b-two"><div class="b-avoid"><h4>Avoid</h4><ul>' + liList(b.approach.avoid) + '</ul></div><div class="b-watch"><h4>Be ready for these concerns</h4><ul>' + liList(b.approach.watch) + '</ul></div></div></section>';
}
function renderAlways(b) {
  return '<div class="always"><span class="lbl">State with every claim</span><ul>' + b.core.map(function (id) {
    const f = FIND[id]; return '<li><span>' + esc(CORE_SHORT[id]) + '</span><span class="fr-s">' + f.s.map(function (x) { return srcChip(x[0], x[1], f.x); }).join('') + '</span></li>'; }).join('') + '</ul></div>';
}
function renderPoints(b, n) {
  return '<section class="bsec' + (n ? '' : ' flat') + '">' + bsecHead(n, 'Talking points', '<em>' + b.points.length + ' points</em>') +
    '<p class="hint">Each point is built from named findings, with the limit to state alongside it.</p><ol class="tps">' + b.points.map(function (t, i) {
      return '<li class="tp"><span class="tp-n" aria-hidden="true">' + (i + 1) + '</span><div class="tp-b"><h4>' + esc(t.title) + '</h4><p class="tp-why">' + esc(t.purpose) + '</p>' +
        '<blockquote class="tp-say">\u201c' + esc(t.say) + '\u201d</blockquote>' +
        '<div class="tp-s"><span class="lbl">Backed by</span>' + uniqueChips(t.backed) + '<span class="fid">' + t.backed.join(' \u00b7 ') + '</span></div>' +
        '<div class="tp-l"><span class="lbl">State alongside</span><ul class="flist">' + findingRows(findingsOf(t.limits), { noId: true }) + '</ul></div>' +
        '<details class="tp-d"><summary>Show the findings behind this point</summary><ul class="flist">' + findingRows(findingsOf(t.backed)) + '</ul></details></div></li>'; }).join('') + '</ol></section>';
}
function renderQA(b, n) {
  return '<section class="bsec' + (n ? '' : ' flat') + '"><div class="bsec-h">' + bsecHead(n, 'Questions this doctor is likely to ask, with honest answers', '<em>' + b.questions.length + ' questions</em>') +
    '<button type="button" class="btn ghost sm" data-act="brief-toggle">Expand all</button></div>' +
    '<p class="hint">Answered from the knowledge base. Where it has no answer, the briefing says so instead of guessing.</p><div class="qas">' + b.questions.map(function (x, i) {
      const a = x.answer;
      const bdg = a.kind === 'covered' ? badge('Evidence available', 'ok') : a.kind === 'partial' ? badge('Review may be needed', 'amb') : badge('Not in knowledge base', 'bad');
      let body;
      if (a.kind === 'notcovered') {
        body = '<p class="qa-say"><span class="lbl">Answer</span>\u201c' + esc(a.say) + '\u201d</p>' +
          '<p class="qa-nc">The knowledge base does not cover <b>' + esc(a.topic || 'this question') + '</b>.</p>' +
          (a.rel.length ? '<div class="qa-f"><span class="lbl">What the knowledge base does say nearby</span><ul class="flist">' + findingRows(findingsOf(a.rel)) + '</ul></div>' : '') +
          '<div class="limits compact"><h4>' + icon('alert') + 'Keep in mind</h4><ul class="flist">' + findingRows(findingsOf(a.limits), { noId: true }) + '</ul></div>' +
          '<div class="btn-row"><button type="button" class="btn ghost sm" data-act="ask-from" data-q="' + esc(x.q) + '">Open in Ask the Evidence</button><button type="button" class="btn ghost sm" data-act="sci-send" data-q="' + esc(x.q) + '">Send as scientific question</button></div>';
      } else {
        body = '<p class="qa-say"><span class="lbl">Answer</span>\u201c' + esc(sub(a.say || a.lead)) + '\u201d</p>' +
          '<div class="qa-f"><span class="lbl">Backed by</span><ul class="flist">' + findingRows(findingsOf(a.findings)) + '</ul></div>' +
          '<div class="limits compact"><h4>' + icon('alert') + 'State the limits</h4><ul class="flist">' + findingRows(findingsOf(a.limits), { noId: true }) + '</ul></div>' +
          '<div class="btn-row"><button type="button" class="btn ghost sm" data-act="ask-entry-from" data-id="' + a.topicId + '">Open the full answer</button></div>';
      }
      return '<details class="qa ' + a.kind + '"' + (i < 2 ? ' open' : '') + '><summary><span class="q-main"><b>' + esc(x.q) + '</b><span>' + esc(x.why) + '</span></span>' + bdg + '</summary><div class="qa-b">' + body + '</div></details>';
    }).join('') + '</div></section>';
}

function briefingHTML(d) {
  const st = state.briefs[d.id];
  if (!st) return '';
  if (st.loading) return briefLoadingHTML();
  const p = PERSONAS[d.persona];
  const v = briefVisitFor(d, st);

  const upcoming = state.visits.filter(function (x) { return x.doc === d.id && x.status !== 'completed'; }).sort(function (a, c) { return (a.date + a.time) < (c.date + c.time) ? -1 : 1; });
  const opts = '<option value="none"' + (!v ? ' selected' : '') + '>General briefing (no specific visit)</option>' + upcoming.map(function (x) {
    return '<option value="' + x.id + '"' + (v && v.id === x.id ? ' selected' : '') + '>' + rel(x.date) + ', ' + to12h(x.time) + ': ' + esc(x.objective) + '</option>'; }).join('');
  return '<section class="card brief" id="brief">' +
    '<div class="brief-h"><div><h2>Visit briefing</h2><p class="hint">For <b>' + d.name + '</b> ' + personaChip(d.persona) + ' Built from the ' + p.label + ' persona and <b>' + b.findingCount + '</b> findings in the knowledge base.</p></div>' +
    '<div class="brief-actions"><label class="sel"><span class="sr">Briefing for</span><select id="briefVisit" data-act="brief-visit" data-id="' + d.id + '">' + opts + '</select></label>' +

    '<p class="brief-foot hint">Every product statement above comes from the knowledge base. Section 1 is persona coaching and contains no product claims. Check any claim with Medical Affairs before using it outside these documents.</p></section>';
}

function briefingText(d, st) {
  const p = PERSONAS[d.persona]; const v = briefVisitFor(d, st); const b = buildBriefing(d, v);
  const L = [];
  L.push('VISIT BRIEFING: ' + d.name + ' (' + p.label + ')' + (v ? ' | ' + rel(v.date) + ' ' + to12h(v.time) + ': ' + v.objective : ''));
  L.push('Built from the persona and ' + b.findingCount + ' findings in the knowledge base. ' + co().product + ' / ' + co().name + '.');
  L.push(''); L.push('STATE WITH EVERY CLAIM');
  b.core.forEach(function (id) { L.push('- ' + CORE_SHORT[id] + ' [' + srcLabels([id]).join('; ') + ']'); });
  L.push(''); L.push('1. RECOMMENDED DISCUSSION APPROACH (coaching, not from the documents)');
  L.push(b.approach.headline + ' ' + b.approach.time);
  if (v && v.open) L.push('Opening for this visit: ' + v.open);
  b.approach.steps.forEach(function (x, i) { L.push('  ' + (i + 1) + '. ' + x.t + ': ' + x.d); });
  L.push('Avoid: ' + b.approach.avoid.join('; ')); L.push('Be ready for: ' + b.approach.watch.join('; '));
  L.push(''); L.push('2. TALKING POINTS');
  b.points.forEach(function (t, i) {
    L.push((i + 1) + '. ' + t.title); L.push('   "' + t.say + '"'); L.push('   Sources: ' + srcLabels(t.backed).join('; '));
    t.limits.forEach(function (id) { L.push('   State alongside: ' + FIND[id].x + ' [' + srcLabels([id]).join('; ') + ']'); });
  });
  L.push(''); L.push('3. LIKELY QUESTIONS AND HONEST ANSWERS');
  b.questions.forEach(function (x, i) {
    const a = x.answer; L.push((i + 1) + '. ' + x.q + ' (' + x.why + ')');
    if (a.kind === 'notcovered') { L.push('   Not covered in the knowledge base. Say: "' + a.say + '"'); }
    else {
      L.push('   Say: "' + sub(a.say || a.lead) + '"');
      a.findings.forEach(function (id) { L.push('   - ' + FIND[id].x + ' [' + srcLabels([id]).join('; ') + ']'); });
      a.limits.forEach(function (id) { L.push('   Limit: ' + FIND[id].x + ' [' + srcLabels([id]).join('; ') + ']'); });
    }
  });
  return L.join('\n');
}

function visitCardsHTML() {
  let list = state.visits.slice();
  if (state.visitFilter === 'upcoming') list = list.filter(function (v) { return v.status !== 'completed'; });
  if (state.visitFilter === 'recent') list = list.filter(function (v) { return v.status === 'completed'; });
  if (state.visitPersona !== 'all') list = list.filter(function (v) { return docById(v.doc).persona === state.visitPersona; });
  list.sort(function (a, b) { const k = (a.date + a.time) < (b.date + b.time) ? -1 : 1; return state.visitFilter === 'upcoming' ? k : -k; });
  if (state.visitFilter !== 'all') { // one card per doctor: their next visit (Upcoming) or latest visit (Recent)

    return '<article class="vcard"><div class="vc-h"><div class="vc-doc">' + avatar(d) + '<div><b>' + d.name + '</b><span>' + d.specialty + '</span><span>' + d.hospital + '</span></div></div>' + visitBadge(v) + '</div>' +

      '<p class="vc-obj">' + esc(v.objective) + '</p><div class="vc-f">' + personaBadge(d.persona) + '<a class="btn ' + (v.status === 'completed' ? 'ghost' : 'primary') + '" href="#/visits/' + v.id + '" data-act="go">Open Visit Workspace</a></div></article>';
  }).join('') + '</div>';
}
function fuStatusBadge(s) { return badge(s, s === 'Done' || s === 'Reviewed' ? 'ok' : s === 'Scheduled' ? 'brand' : s === 'In Review' ? 'amb' : 'plain'); }
function followupsTab() {

/* ==========================================================================
   Backend connection: signing in, loading the signed-in space, and the

   The token is kept in sessionStorage; the server decides which space it opens.

function wordCount(t) { return (String(t).trim().match(/\S+/g) || []).length; }

let memToken = '';
let appReady = false;
function getToken() { try { return sessionStorage.getItem('pra_token') || memToken; } catch (e) { return memToken; } }

function apiCall(method, path, body, timeoutMs, noAuth) {

function liveErrorText(err) {

  if (s === 401) return 'Your session has ended. Please sign in again.';
